name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # Using Python 3.9 for better compatibility
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==5.13.0
        pip install cryptography==39.0.0
    
    - name: Build universal executable (works on both 32/64-bit)
      run: |
        pyinstaller --onefile --windowed --name "SecureVault" --target-architecture universal2 password_manager.py
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SecureVault
        path: dist/*.exe
