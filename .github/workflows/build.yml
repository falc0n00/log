name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build 32-bit executable
      run: |
        pyinstaller --onefile --windowed --name "SecureVault_x86" password_manager.py
    
    - name: Build 64-bit executable
      run: |
        pyinstaller --onefile --windowed --name "SecureVault_x64" password_manager.py
    
    - name: Upload both executables
      uses: actions/upload-artifact@v4
      with:
        name: SecureVault
        path: dist/*.exe
